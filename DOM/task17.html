<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task17</title>
</head>
<body>
    <ul id="list">

<li>Apple</li>

<li>Banana</li>

<li>Mango</li>

</ul>

<button onclick="countItem()">
Count
</button>

<p id="output"></p>

<script>

function countItem(){

    let count =
    document.getElementById("list")
    .children.length;

    document.getElementById("output")
    .textContent = count;

}
</script>
</body>
</html>
