<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task16</title>
</head>
<body>
    

    <ul id="list">
        <li>Apple</li>
        <li>Orange</li>
        <li>Banana</li>
        <li>Papaya</li>
        <li>Kiwi</li>
    </ul>
    <button onclick="removeItem()">Clik To Remove</button>
    <script>
        function removeItem(){
            let list=document.getElementById("list")
            list.removeChild(list.lastElementChild)
        }
    </script>
</body>
</html>
