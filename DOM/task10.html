<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task10</title>
</head>
<body>
    <p id="datetime"></p>
    <button onclick="showDateTime()">Show Date & Time</button>
    <script>
        function showDateTime(){
            const now =new Date()
            document.getElementById("datetime").textContent=now.toLocaleString()
        }
    </script>
</body>
</html>
