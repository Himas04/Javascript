<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <input type="text" id="input" placeholder="enter a value">
    <button onclick="showValuea()">Click ME!</button>

    <h2 id="output"></h2>
    
    <script>
        function showValuea(){
            let a=document.getElementById("input").value
            document.getElementById("output").textContent  = a 
        }
    </script>
