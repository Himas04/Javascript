<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task20</title>
    <style>
         .dark {

            background-color: black;

            color: rgb(250, 250, 250);

        }
    </style>
</head>
<body>
    <button onclick="changeMode()">Click ME!🤡</button>
    <script>
        function changeMode(){
            document.body.classList.toggle("dark")
        }
    </script>
</body>
</html>
