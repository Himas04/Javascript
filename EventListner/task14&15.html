<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task11</title>
  </head>

  <body>
    <input type="text" placeholder="Enter text" />

    <p id="output"></p>

    <p>Count Of Letter: <span id="count">0</span></p>

    <p id="message"></p>

    <script>
      let text = document.querySelector("input");
      let output = document.getElementById("output");
      let count = document.getElementById("count");
      let message = document.getElementById("message");

      text.addEventListener("input", () => {
        output.innerHTML = text.value;
        output.style.textTransform = "uppercase";
        count.innerHTML = text.value.length;
      });

      text.addEventListener("focus", () => {
        message.innerHTML = "Input Focused";
      });

      text.addEventListener("blur", () => {
        message.innerHTML = "Input Lost Focus";
      });
    </script>
  </body>
</html>
