<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task4</title>
</head>
<body>
    <div id="head">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ducimus voluptates odit eius fugiat qui id aliquid voluptatem nemo voluptate fuga!</p>
    </div>

    <script>
        let head=document.getElementById("head")

        head.addEventListener("mouseover",()=>{
            head.style.color="red"
        })
        head.addEventListener("mouseout",()=>{
            head.style.color="black"
        })
    </script>
</body>
</html>
