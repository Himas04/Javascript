<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <input type="text" placeholder="Enter text">
    <p id="output"></p>
    <p>Counts OF Letter: <span id="count"></span></p>

    <script>
        let text=document.querySelector("input")
        let countletter=document.getElementById("count")

        text.addEventListener("input",()=>{
            output.innerHTML=text.value;
            output.style.textTransform="uppercase";
            count.innerHTML=text.value.length

        })
    </script>
</body>
