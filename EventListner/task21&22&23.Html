<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task20</title>
  </head>
  <body>
    <p id="output"></p>
    <p>Count of KEYPressed: <span id="count"></span></p>
    <script>
      let input = document.querySelector("body");
      let output = document.getElementById("output");
      let keyCount = 0;

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          output.innerHTML = "Enter Pressed";
        } else {
          output.innerHTML = e.key;
        }
        keyCount++;
        count.innerHTML = keyCount;
      });
    </script>
  </body>
</html>
