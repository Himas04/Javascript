<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task11</title>
</head>
<body>
    <input type="text" placeholder="Enter text">
    <p id="output"></p>

    <script>
        let text=document.querySelector("input")

        text.addEventListener("change",()=>{
            output.innerHTML=text.value
        })
    </script>
</body>
</html>
