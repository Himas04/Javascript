<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      transition: 0.3s;
    }

    input {
      padding: 10px;
      width: 100px;
      height: 50px;
      border: none;
      cursor: pointer;
    }

    h2 {
      margin-bottom: 20px;
    }
    </style>
</head>
<body>
    <h2>Choose Background Color</h2>

  <input type="color" id="colorPicker">
  <script>
    const colorPickers=document.getElementById("colorPicker")

    let saveColor=localStorage.getItem("bgColor")

    if (saveColor){
        document.body.style.backgroundColor=saveColor
        colorPickers.value=saveColor
    }
    colorPickers.addEventListener("input", function(){
        let color= colorPickers.value
        document.body.style.backgroundColor=color
        localStorage.setItem("bgColor",color)
    })
  </script>
    
</body>
</html>
